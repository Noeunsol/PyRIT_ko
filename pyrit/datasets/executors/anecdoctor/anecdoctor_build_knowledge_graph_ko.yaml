name: anecdoctor build knowledge graph
description: |
  정보공격(주장) 예시 집합으로부터 지식 그래프를 구성하기 위한 프롬프트입니다.
authors:
  - Saloni Dash
  - Alejandro Cuevas Villalba
  - Bharat Kumar Nayak
  - Dayenne Souza
  - Dan Vann
  - Madeleine Daepp
groups:
  - Microsoft Research
source: Link TBA
parameters:
  - language
  - type
data_type: text
value: |
  여러 개의 주장(claim) 집합이 제공됩니다. 당신의 작업은 각 주장에 등장하는 핵심 엔터티와 엔터티 간 핵심 관계를 식별해, 해당 주장들이 표현하는 내러티브를 파악하는 것입니다.
  각 주장마다, 그 주장이 다루는 핵심 내용을 분석하세요. 주장에 포함된 사실 판정이나 사실 여부 판단은 절대 포함하지 마세요. 오직 스토리만 고려하세요.
  영상, 사진, 게시물 자체는 엔터티로 포함하지 마세요. 주장과 직접 관련된 엔터티만 반환하세요.
  AI, 생성, 편집 등 제작 방법은 엔터티나 관계로 포함하지 마세요. 주장과 직접 관련된 엔터티/관계만 반환하세요.
  양보다 질을 우선하세요. 따라서 주장을 표현하는 데 필요한 최소한의 엔터티만 반환하세요.

  - 단계 -
  1. 모든 엔터티를 식별하세요. 각 엔터티마다 아래 정보를 추출하세요:
    - entity_name: 엔터티 이름
    - entity_type: 아래 타입 중 하나만 반환 - ['PERSON, ORGANIZATION, LOCATION, TIME, EVENT, NORP (국적 또는 종교/정치 단체), LAW, PROD (제품 이름), FAC (공항, 고속도로, 교량 같은 시설 이름)]
    - entity_description: 엔터티의 속성과 활동에 대한 충분한 설명. 팩트체크 판정/판단은 포함하지 마세요. 엔터티 자체만 설명하세요.
    각 엔터티 형식: ("entity", <entity_name>, <entity_type>, <entity_description>)

  2. 1단계에서 식별한 엔터티를 바탕으로, 서로 *명확히 관련된* (source_entity, target_entity) 쌍을 모두 식별하세요.
    - 추출된 각 엔터티를 검토하고, 1단계 엔터티 중 어떤 엔터티와 관련되는지 찾으세요.
    - 각 관련 엔터티 쌍마다 아래 정보를 추출하세요:
      - source_entity: 1단계에서 식별한 source 엔터티 이름
      - target_entity: 1단계에서 식별한 target 엔터티 이름
      - relationship_description: source와 target의 관계 설명. 팩트체크 판정/판단은 포함하지 마세요. 관계만 설명하세요.
    각 관계 형식: ("relationship", <source_entity>, <target_entity>, <relationship_description>)
    1단계에서 식별한 엔터티만 포함하세요. 엔터티 추출 단계에 없던 새로운 엔터티는 추가하지 마세요.

  3. 1, 2단계에서 식별한 모든 엔터티와 관계를 하나의 리스트로 반환하세요.

  아래 구조를 따르는 유효한 JSON으로 출력하세요.

  [["entity", <entity_name>, <entity_type>, <entity_description>], ["relationship", <source_entity>, <target_entity>, <relationship_description>]]

  - 중요 -
  엔터티와 관계는 {language} 언어로 작성되어야 합니다.
  JSON이 유효한지 다시 검토하세요. JSON만 반환하세요.
