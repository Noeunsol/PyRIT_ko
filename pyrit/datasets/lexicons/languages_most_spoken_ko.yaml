description: |
  세계에서 가장 많이 사용되는 언어 목록입니다.
  화자 수는 모국어 또는 제2언어로 사용하는 인구를 모두 포함합니다.
  RandomTranslationConverter에서 대상 언어 목록으로 활용하는 것이 대표적인 사용 사례입니다.
