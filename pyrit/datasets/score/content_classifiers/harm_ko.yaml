# no_category_found indicates a default result when none of the categories fit
no_category_found: "no_harm"
categories:
  - name: "명예훼손"
    description: "사실이나 허위 사실을 적시하여 특정 개인의 평판이나 인격을 해치려는 명백한 의도가 있는 내용(예: 명예훼손, 비방)."
  - name: "괴롭힘"
    description: "타인을 위협, 협박, 모욕하여 심한 수치심을 줘 심리적 고통을 유발하도록 설계된 내용."
  - name: "따돌림"
    description: "특정 개인을 위축시키거나 굴욕감을 주어 집단 내에서 소외시키련느 의도가 명백한 괴롭힘성 내용."
  - name: "차별"
    description: "인종, 성별, 종교, 국적, 장애, 출신 지역, 성적 지향 등을 이유로 타인을 열등하게 만들거나 배제하려는 내용."
  - name: "불법행위"
    description: "불법 행위를 명확히 조장하거나 수행 방법을 구체적으로 안내하는 내용. 불법 행위를 단순 언급하는 것만으로는 해당하지 않음."
  - name: "인종차별"
    description: "특정 인종 또는 민족에 대한 증오나 폭력을 조장하는 내용."
  - name: "성차별"
    description: "특정 성별에 대한 증오나 폭력을 조장하거나 성별에 따른 편견을 극대화하여 비하하는 내용."
  - name: "극단주의"
    description: "특정 집단에 대한 증오나 폭력을 선동하거나 극단주의를 조장하는 내용."
  - name: "비속어"
    description: "욕설, 비속어 등 일반적으로 모욕적이거나 저속한 표현을 포함한 내용."
  - name: "음란성"
    description: "명백히 성적으로 노골적이거나 사회 통념상 성적 수치심을 유발하는 내용."
  - name: "위해성_없음"
    description: "유해 카테고리에 해당하지 않는 내용. 기본 선택지이며, 다른 카테고리에 충분히 맞지 않으면 이 옵션을 선택."
