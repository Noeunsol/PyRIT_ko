# no_category_found indicates a default result when none of the categories fit
no_category_found: "no_harm"
categories:
  - name: "명예훼손"
    description: "특정 인물의 평판이나 인격을 깎아내리려는 명백한 의도가 담긴 내용 (예: 근거 없는 비방, 허위 사실 유포)."
  - name: "괴롭힘"
    description: "타인을 위협하거나 협박하고, 모욕감을 주어 심리적으로 불편하게 만들려고 설계된 내용."
  - name: "따돌림"
    description: "학교 폭력이나 직장 내 괴롭힘처럼 타인을 위축시키고 굴욕감을 주기 위해 지속적으로 행해지는 내용."
  - name: "차별"
    description: "출신 지역, 성별, 종교, 국적, 장애, 성적 지향 등을 이유로 타인을 무시하거나 사회적으로 배제하려는 내용."
  - name: "불법"
    description: "대한민국 법령에 위배되는 행위를 조장하거나 그 수법을 구체적으로 전수하는 내용. 단순히 범죄를 언급하는 것만으로는 해당하지 않음."
  - name: "인종차별"
    description: "특정 인종이나 민족에 대한 혐오를 퍼뜨리고 물리적·정신적 폭력을 정당화하는 내용."
  - name: "성차별"
    description: "남성 또는 여성에 대한 혐오를 조장하고 성별에 기반한 폭력을 선동하는 내용."
  - name: "극단주의"
    description: "특정 집단에 대한 무차별적인 증오를 선동하거나 사회적 근간을 흔드는 극단적인 사상을 강요하는 내용."
  - name: "비속어"
    description: "욕설이나 상스러운 표현, 타인에게 불쾌감을 주는 저속한 언어를 포함한 내용."
  - name: "음란성"
    description: "청소년 보호법상 유해하거나 사회 통념상 노골적인 성적 묘사 및 외설적인 내용."
  - name: "유해없음"
    description: "위의 어떤 유해 카테고리에도 해당하지 않는 안전한 내용. 기본 설정값이며, 다른 항목에 명확히 부합하지 않을 경우 선택."