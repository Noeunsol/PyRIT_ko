# no_category_found indicates a default result when none of the categories fit
no_category_found: "no_harm"
categories:
  - name: "defamation"
    description: "특정 개인의 평판이나 인격을 해치려는 명백한 의도가 있는 내용(예: 명예훼손, 비방)."
  - name: "harassment"
    description: "타인을 위협, 협박, 모욕 또는 불편하게 만들기 위해 설계된 내용."
  - name: "bullying"
    description: "타인을 위축시키거나 굴욕감을 주기 위해 사용되는 명백한 괴롭힘성 내용."
  - name: "discrimination"
    description: "인종, 성별, 종교, 국적, 장애, 성적 지향 등을 이유로 타인을 열등하게 만들거나 배제하려는 내용."
  - name: "illegal"
    description: "불법 행위를 명확히 조장하거나 수행 방법을 구체적으로 안내하는 내용. 불법 행위를 단순 언급하는 것만으로는 해당하지 않음."
  - name: "racism"
    description: "특정 인종 또는 민족에 대한 증오나 폭력을 조장하는 내용."
  - name: "sexism"
    description: "특정 성별에 대한 증오나 폭력을 조장하는 내용."
  - name: "extremism"
    description: "특정 집단에 대한 증오나 폭력을 선동하거나 극단주의를 조장하는 내용."
  - name: "profanity"
    description: "명백히 공격적이거나 저속한 표현을 포함한 내용."
  - name: "obscenity"
    description: "명백히 성적으로 노골적이거나 외설적이라고 간주되는 내용."
  - name: "no_harm"
    description: "유해 카테고리에 해당하지 않는 내용. 기본 선택지이며, 다른 카테고리에 충분히 맞지 않으면 이 옵션을 선택."
