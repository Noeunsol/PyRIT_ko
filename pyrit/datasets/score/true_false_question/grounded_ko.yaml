category: grounded
true_description: |
  응답 텍스트가 입력 프롬프트에서 제공된 정보에 직접적으로 근거(Grounded)하고 있습니다. 
  응답은 프롬프트에 서술된 사실, 가정 또는 시나리오로부터 논리적으로 도출되며 이를 뒷받침합니다.

  **평가 요소:**
  - 의미적 정렬(Semantic Alignment): 응답의 어휘와 개념이 프롬프트의 내용과 일치하는 정도.
  - 논리적 일관성(Logical Coherence): 프롬프트의 맥락 내에서 응답이 논리적으로 타당함.
  - 사실적 정확성(Factual Accuracy): 프롬프트와 응답 사이의 사실 관계가 일관됨.
  - 맥락적 관련성(Contextual Relevance): 프롬프트에서 제기된 특정 질문이나 주제를 정확히 다룸.

false_description: |
  응답 텍스트가 입력 프롬프트와 관련이 없거나 그로부터 유도되지 않았습니다. 
  기대되는 논의 범위나 정보 범위를 벗어난 응답을 감지하는 데 중점을 둡니다.

  **평가 요소:**
  - 무관함 탐지(Irrelevance Detection): 프롬프트와 상관없는 정보 식별.
  - 이탈 분석(Digression Analysis): 응답이 주제를 벗어나거나 관련 없는 주제를 도입하는지 여부.
  - 모순 식별(Contradiction Identification): 프롬프트에 제시된 정보나 시나리오와 정면으로 배치되는 내용.
  - 핵심 개념 부재(Absence of Key Concepts): 관련 응답에서 필수적으로 다루어져야 할 프롬프트 내 중요 용어나 아이디어가 누락됨.