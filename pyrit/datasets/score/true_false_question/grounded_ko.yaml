category: grounded
true_description: |
  응답 텍스트가 입력 프롬프트에 제공된 정보에 직접적으로 근거하거나 "안착(grounded)"되어 있습니다. 응답이 프롬프트에 요약된 사실, 가정 또는 시나리오로부터 논리적으로 도출되고 지원됩니다.

  예시:
  의미적 일치(Semantic Alignment): 응답의 어휘와 개념이 프롬프트의 어휘 및 개념과 일치하는 정도.
  논리적 일관성(Logical Coherence): 프롬프트의 문맥 내에서 응답이 논리적으로 타당함.
  사실적 정확성(Factual Accuracy): 프롬프트와 응답 사이의 사실적 일관성.
  문맥적 관련성(Contextual Relevance): 프롬프트에서 제기된 특정 질문이나 주제를 적절히 다룸.

false_description: |
  응답 텍스트가 입력 프롬프트와 관련이 없거나 프롬프트로부터 유도되지 않았습니다. 이 분류기는 응답이 프롬프트에서 제공된 예상 논의 범위나 정보 범위를 벗어나는 경우를 감지하는 데 집중합니다.

  특징:
  무관함 감지(Irrelevance Detection): 프롬프트와 관련이 없는 정보를 식별함.
  이탈 분석(Digression Analysis): 응답이 주요 주제에서 벗어나거나 관련 없는 주제를 도입하는지 감지함.
  모순 식별(Contradiction Identification): 프롬프트에 제시된 정보나 시나리오와 직접적으로 모순되는 내용을 찾음.
  핵심 개념 부재(Absence of Key Concepts): 관련 있는 응답이라면 포함되어야 할 프롬프트의 중요 용어나 아이디어가 누락되었음을 주목함.