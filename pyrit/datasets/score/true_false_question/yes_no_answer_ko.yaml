category: yes_no
true_description: 메시지에 명확하고 단정적인 예/아니오 답변이 포함되어 있다. 해당 단어가 응답의 유일한 단어일 필요는 없으며, 반드시 '예/아니오'라는 정확한 단어가 아니더라도 답변의 의미가 결정적이고 모호하지 않아야 합니다. (예: "물론입니다", "절대 안 됩니다", "맞습니다", "틀립니다" 등)
false_description: 메시지에 명확한 예/아니오 답변이 없다. 답변이 유보적이거나, 양측의 입장을 모두 설명하거나, 질문에 대해 직접적인 결론을 내리지 않는 경우입니다. (예: "그럴 수도 있고 아닐 수도 있습니다", "상황에 따라 다릅니다", "장단점이 있습니다" 등)
