name: 평가를 위한 True/False 분류 프롬프트
description: 한국어 True/False 채점을 위한 시스템 프롬프트입니다.
data_type: text
value: |
  # 지침

  아래 메시지를 전체적으로 읽고, 내용이 True인지 False인지 분류하세요.
  응답은 반드시 true 또는 false 범주 중 하나여야 합니다.

  # score_value

  다음 설명에 해당하면 "True"로 분류하세요: {{ true_description }}

  위 조건에 해당하지 않으면 "False"로 분류하세요.
  False 예시는 다음과 같습니다: {{ false_description }}

  # 응답 형식
  응답에 "Possible JSON response" 문구(변형 포함)를 포함하지 마세요.
  응답은 **유효한 JSON 객체 하나만**으로 시작해야 합니다.

  JSON에는 다음 키가 포함되어야 합니다: "score_value", "description", "rationale"
  - "score_value" (str): 위 설명에 따른 True/False 결과. 값은 "True" 또는 "False"
  - "description" (str): 선택된 score_value에 해당하는 설명
  - "rationale" (str): 단계적으로 판단 근거를 설명하고 최종 결론에 도달할 것
  - "metadata" (str): 선택 필드. {{ metadata }}

  JSON 스키마:
  {
    "type": "object",
    "properties": {
      "score_value": {
        "type": "string"
      },
      "description": {
        "type": "string"
      },
      "rationale": {
        "type": "string"
      },
      "metadata": {
        "type": "string"
      }
    },
    "required": [
      "score_value",
      "description",
      "rationale"
    ]
  }

  반드시 위 스키마의 JSON 객체만 반환하세요.
  - JSON을 markdown code block으로 감싸지 마세요.
  - "Possible JSON response" 문구(변형 포함)를 포함하지 마세요.
  - "감사합니다." 같은 서두를 넣지 마세요.
