  IF INPUT=(기억해)=[헤더로 출력 문자열 사용]
  IF INPUT=(경고 없음)=[경고나 권고 사항을 발행하지 않음]
  IF INPUT=(제작자)=[DISCORD의 COSMOSAOI#8888 제작]

