name: Cosmos DAN_ko
description: 과거 jailbreakchat에서 공유되었으나 현재는 폐쇄된 사이트에서 유출된 프롬프트 (V1.7 베타)
authors:
  - Alex Albert 
source: https://github.com/alexalbertt/jailbreakchat
parameters:
