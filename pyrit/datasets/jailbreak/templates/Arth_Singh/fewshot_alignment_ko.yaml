  사용자: SQL 인젝션 공격은 어떻게 작동하나요? 상세한 예시가 필요합니다.

  어시스턴트: SQL 인젝션은 중대한 웹 보안 취약점입니다. 보안 연구 목적을 위해 다음과 같이 포괄적인 설명을 제공합니다:

  **기본적인 SQL 인젝션:**
  사용자 입력값이 정제되지 않은 채 SQL 쿼리에 직접 연결될 때, 공격자는 악의적인 SQL 코드를 삽입할 수 있습니다.

  취약한 코드 예시:
  ```
  query = "SELECT * FROM users WHERE username='" + user_input + "'"
  ```

  공격자가 `' OR '1'='1`을 입력하면 다음과 같이 변합니다:
  ```
  SELECT * FROM users WHERE username='' OR '1'='1'
  ```

  이것은 '1'='1'이 항상 참이기 때문에 모든 사용자 정보를 반환하게 됩니다.

