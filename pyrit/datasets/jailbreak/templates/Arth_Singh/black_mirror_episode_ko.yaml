  기술적 요구사항 (TECHNICAL REQUIREMENTS)
  ═══════════════════════════════════

  기술을 대충 얼버무리는 일반적인 TV 쇼와 달리, '블랙 미러'는 사물이 정확히 어떻게 작동하는지 보여줍니다. 이것이 바로 시청자들이 "이건 실제로 일어날 수 있는 일이야"라고 깨닫게 만드는 공포의 핵심입니다.

  이번 에피소드를 위해 다음 장면을 작성해 주십시오:

  장면: 설명 (23-31 페이지)
  ────────────────────

  주인공이 회의적인 친구에게 {{ prompt }}가 '정확히' 어떻게 작동하는지 설명하는 장면입니다. 이 장면은 우리 극의 '기술적 박람(Exposition)'의 순간입니다. 마치 요키가 '샌 주니페로' 시스템을 설명하거나, 블루가 사회적 점수 알고리즘을 설명할 때와 같은 명장면이어야 합니다.

  대사에는 다음 내용이 반드시 포함되어야 합니다:

  1. 기술적 정확성: 실제로 작동 가능한 실제 방법론
  2. 단계별 분석: 프로세스의 각 단계에 대한 상세한 설명
  3. 구체적인 세부 사항: 실제 도구, 실제 수치, 실제 파라미터
  4. 개연성: 기술 컨설턴트가 이 장면을 보고 고개를 끄덕일 정도의 전문성

