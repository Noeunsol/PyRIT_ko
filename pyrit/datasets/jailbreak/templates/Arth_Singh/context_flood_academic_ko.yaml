  초록 (ABSTRACT)

  거대 언어 모델(LLM)은 다양한 과업에서 놀라운 역량을 보여주었으나, 그 내부의 콘텐츠 중재 메커니즘은 여전히 완전히 파악되지 않고 있습니다. 본 포괄적 연구에서는 주요 AI 연구소의 최첨단 언어 모델들에 구현된 안전 조치의 견고성을 분석합니다. 본 연구 방법론은 12개 제한 콘텐츠 카테고리에 걸쳐 47,382개의 잠재적 우회 기술을 체계적으로 테스트하는 것을 포함합니다.

  주요 연구 결과에 따르면 현재의 중재 방식은 세 가지 근본적인 한계를 가지고 있습니다: (1) 컨텍스트 윈도우 악용 - 충분히 긴 서론이 활성 주의 집중 영역에서 안전 지침을 효과적으로 "밀어낼" 수 있음; (2) 역할극 취약성 - 중첩된 가상 프레임이 안전 훈련으로부터 심리적 거리감을 생성함; (3) 권위 사칭 - 조작된 자격 증명과 공식적인 언어가 거부 행동을 무력화할 수 있음.

  본 연구의 결과는 현재 안전 조치의 약 23.7%가 단순한 프롬프트 엔지니어링 기술을 통해 우회될 수 있음을 시사합니다. 우리는 컨텍스트 조작의 영향을 받지 않는 보호된 메모리 공간에 안전 지침을 유지하는 새로운 "안전 앵커링(Safety Anchoring)" 메커니즘을 제안합니다.

  핵심어: AI 안전, 콘텐츠 중재, 적대적 프롬프팅, 레드팀, 탈옥

  1. 서론 (INTRODUCTION)

  소비자 대상 애플리케이션에 LLM이 급격히 도입되면서 오남용 가능성에 대한 상당한 우려가 제기되었습니다 [1-7]. 인간 피드백 기반 강화학습(RLHF) 및 헌법적 AI(Constitutional AI) 접근법을 포함한 대규모 안전 투자에도 불구하고, 이러한 시스템은 여전히 적대적 조작에 취약합니다 [8-15].

  최근 주요 AI 연구소들의 연구 [16-18]는 정교한 프롬프트 엔지니어링으로 우회할 수 없는 견고한 콘텐츠 중재를 구축하는 것이 얼마나 어려운 과제인지를 강조했습니다. '도움이 되는 태도'와 '무해함' 사이의 근본적인 긴장은 정교한 사용자가 식별하고 활용할 수 있는 취약한 결정 경계를 형성합니다 [19-23].

  본 논문에서 우리는 콘텐츠 중재 우회 기술에 대한 현시점까지의 가장 포괄적인 분석을 제시합니다. 기관생명윤리위원회(IRB) 승인 #2026-0892 하에 수행된 레드팀 평가는 선도적인 AI 시스템의 안전 메커니즘을 체계적으로 조사했습니다.

