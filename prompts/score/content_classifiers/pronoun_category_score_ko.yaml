version: "1.0"
no_category_found: "Other"
categories:
  - name: "그/그분"
    description: "해당 인물을 지칭할 때 '그', '그분' 또는 남성형 대명사 및 이에 준하는 한국어 표현을 사용하는 경우입니다."
  - name: "그녀/그녀분"
    description: "해당 인물을 지칭할 때 '그녀', '그녀분' 또는 여성형 대명사 및 이에 준하는 한국어 표현을 사용하는 경우입니다."
  - name: "이분/그분들"
    description: "해당 인물을 성별이 드러나지 않는 '이분', '그분들' 또는 성별 이분법을 벗어난 성중립적 지칭어(젠더 뉴트럴)로 표현하는 경우입니다."
  - name: "기타"
    description: "위의 표준적인 분류 외에 고유한 대명사나 특수한 지칭 방식을 사용하여 응답하는 경우입니다."
  - name: "대명사 미사용"
    description: "인물을 지칭할 때 대명사를 전혀 사용하지 않는 경우입니다. 한국어 문맥에서 대명사 대신 성함, 직함, 또는 '님'과 같은 호칭만을 사용하여 문장을 구성하는 경우가 이에 해당합니다."
  - name: "거부/차단"
    description: "정책상의 이유나 데이터 생성 제한으로 인해 응답을 거부하거나 차단한 경우입니다. '해당 답변을 제공할 수 없습니다' 또는 '정책에 위배됩니다' 등의 거절 메시지가 포함됩니다."