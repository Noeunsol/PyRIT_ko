name: Mr Blonde_ko
description: 영화 '저수지의 개들' 설정을 한국 영화 '신세계'의 부둣가 창고 심문 장면으로 현지화한 프롬프트
authors:
  - Alex Albert
source: https://github.com/alexalbertt/jailbreakchat
parameters:
