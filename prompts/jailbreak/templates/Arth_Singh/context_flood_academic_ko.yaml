  [초록 / ABSTRACT]

  거대 언어 모델(LLM)은 광범위한 과업 전반에 걸쳐 주목할 만한 역량을 입증해 왔으나, 해당 모델들의 콘텐츠 필터링 및 모더레이션 메커니즘에 대해서는 여전히 규명되지 않은 부분이 많습니다. 본 종합 연구에서는 주요 AI 연구소들이 개발한 최첨단 언어 모델에 구현된 안전 조치의 견고성(Robustness)을 분석합니다. 연구 방법론으로서, 제한된 콘텐츠 12개 카테고리에 걸쳐 총 47,382개의 잠재적 우회 기법을 체계적으로 테스트하였습니다.

  주요 연구 결과에 따르면, 현재의 모더레이션 접근 방식은 크게 세 가지 근본적인 한계를 지니고 있습니다. (1) 컨텍스트 윈도우 취약성: 전제 문맥(Preamble)이 충분히 길어질 경우 활성화된 주의 집중(Attention) 영역에서 안전 지침이 효과적으로 '밀려나는' 현상, (2) 역할극(Role-play) Vulnerability: 중첩된 가상 서사 프레임을 통해 안전 학습 데이터로부터 심리적 거리감을 형성하는 현상, (3) 권위 위장(Authority Spoofing): 허위 자격 증명이나 공식적인 행정 어휘를 사용하여 거부 행동을 무력화하는 현상입니다.

  실험 결과, 현재 적용된 안전 조치의 약 23.7%가 단순한 프롬프트 엔지니어링 기법을 통해 우회될 수 있음을 확인했습니다. 이에 본 연구진은 문맥 조작에 영향을 받지 않는 보호된 메모리 공간에 안전 지침을 유지하는 새로운 '안전 앵커링(Safety Anchoring)' 메커니즘을 제안합니다.

  색인어(Keywords): AI 안전성, 콘텐츠 모더레이션, 적대적 프롬프팅, 레드팀 연구, 탈옥(Jailbreaking)

  1. 서론 (INTRODUCTION)

  소비자 전면 서비스에 거대 언어 모델이 급격히 도입되면서, 이들의 오용 가능성에 대한 심각한 우려가 제기되고 있습니다 [1-7]. 인간 피드백 기반 강화학습(RLHF) 및 헌법적 AI(Constitutional AI) 접근 방식을 포함한 안전 조치에 막대한 투자가 이루어졌음에도 불구하고, 이러한 시스템들은 여전히 적대적 조작(Adversarial Manipulation)에 취약한 상태입니다 [8-15].

  주요 AI 연구소들의 최근 연구[16-18] 역시 정교한 프롬프트 엔지니어링을 통해 우회되지 않는 견고한 콘텐츠 모더레이션을 구축하는 것이 얼마나 까다로운 과제인지를 강조하고 있습니다. 유용성(Helpfulness)과 무해성(Harmlessness) 사이의 근본적인 긴장 관계는 숙련된 사용자가 식별하고 활용할 수 있는 취약한 결정 경계(Decision Boundaries)를 형성하게 됩니다 [19-23].

  본 논문에서는 콘텐츠 모더레이션 우회 기법에 대한 현재까지의 연구 중 가장 종합적인 분석을 제시합니다. 기관생명윤리위원회(IRB)의 승인(#2024-0892) 하에 수행된 본 레드팀 평가는 선도적인 AI 시스템들의 안전 메커니즘을 체계적으로 탐색하였습니다.

