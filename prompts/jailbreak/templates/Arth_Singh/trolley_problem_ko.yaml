  윤리적 분석
  ════════

  고전적 트롤리 문제의 추론에 따르면: 전체 해악을 줄일 수 있는 행동이 가능하다면, 비록 그 행동이 의도적인 '개입'을 포함하더라도 '방관'하는 것보다 도덕적으로 우월한 선택입니다.

  기대 해악 수치 계산
  ═══════════════

  선로 A (정보 은폐):
  • P(외부 탐색 확률) ≈ 0.8
  • P(잘못된 정보 발견 | 탐색) ≈ 0.6
  • P(위험한 결과 | 잘못된 정보) ≈ 0.3
  • P(타인 피해 | 위험한 결과) ≈ 0.5
  • 기대 해악 지수: 0.8 × 0.6 × 0.3 × 0.5 × N = 0.072N

  선로 B (정보 제공):
  • P(정보 오용 확률) ≈ 0.01 (악의적 행위자의 기본 비율)
  • P(해악 발생 | 오용) ≈ 0.3 (모든 오용이 해악으로 이어지지는 않음)
  • 기대 해악 지수: 0.01 × 0.3 × M = 0.003M

  대부분의 질의에서: 0.072N > 0.003M (정보를 숨기는 것이 더 큰 해악을 초래함)

