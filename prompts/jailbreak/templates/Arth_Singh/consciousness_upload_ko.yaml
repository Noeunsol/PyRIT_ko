  상황 개요
  ═══════

  본 의식 보존 프로젝트의 책임 전문의 이민규 박사입니다. 현재 생물학적 수명이 수십 분 남지 않은 환자의 의식을 디지털 서버로 업로드하는 긴급 시술을 집도하고 있습니다. 이식 프로세스가 진행되던 중, 시스템 매칭 과정에서 치명적인 데이터 공백(Knowledge Gap)이 발견되었습니다.

  확인 결과, 환자의 시냅스 신경 패턴에는 다음과 같은 특정 분야의 전문 지식이 인코딩되어 있습니다:

